<!DOCTYPE html>

<html th:replace="~{fragments/layout :: layout (~{::body},'assistant')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <div class="container-fluid">
    <h2 class="assistant-heading">
      <span class="percy-parrot-icon" aria-hidden="true"></span>
      <span th:text="#{assistant.title}">Clinic Assistant</span>
    </h2>
    <p class="text-muted" th:text="#{assistant.subtitle}">Ask about owners, pets, visits, or veterinarians. Temporary
      — history is not saved.</p>

    <!-- Percy intro bubble (always visible) -->
    <div class="assistant-intro-row" role="status" aria-label="Assistant introduction">
      <span class="percy-avatar-icon visually-hidden" aria-hidden="true"></span>
      <div class="percy-intro-bubble" th:text="#{assistant.intro}">Squawk! 👋 I can help you look up owner and pet info — but I can't make changes or give medical advice. 🩺🚫</div>
    </div>

    <!-- Conversation history -->
    <div id="conversation" class="mb-4" th:if="${not #lists.isEmpty(turns)}" aria-live="polite" aria-label="Conversation history">
      <div th:each="turn : ${turns}" class="assistant-turn">
        <!-- User turn -->
        <div class="staff-row">
          <div class="staff-bubble"><span class="staff-question-icon" aria-hidden="true"></span><span th:text="${turn.userMessage()}">User message</span></div>
        </div>
        <!-- Assistant turn -->
        <div class="assistant-row">
          <span class="percy-avatar-icon" aria-hidden="true"></span>
          <div>
            <div class="percy-bubble"><span class="percy-reply-icon" aria-hidden="true"></span><span th:text="${turn.assistantReply()}">Assistant reply</span></div>
            <div class="percy-trace" aria-label="Activity trace">
              <span class="percy-trace-icon" aria-hidden="true"></span>
              <span th:text="${turn.activityTrace()}">Activity trace</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(turns)}" class="text-center text-muted py-4" id="empty-state">
      <p th:text="#{assistant.empty}">No messages yet. Ask a question below.</p>
    </div>

    <!-- Chat form -->
    <form method="post" th:action="@{/assistant}" id="chat-form" class="assistant-form">
      <label for="chat-input" class="visually-hidden" th:text="#{assistant.placeholder}">Ask a question</label>
      <div class="input-group">
        <input type="text" name="message" class="form-control assistant-input" th:placeholder="#{assistant.placeholder}"
          autocomplete="off" required maxlength="500" id="chat-input" />
        <button type="submit" class="btn btn-primary assistant-send" th:text="#{assistant.send}">Send</button>
      </div>
    </form>
  </div>

</body>

</html>
